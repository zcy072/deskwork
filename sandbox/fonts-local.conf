<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Office 文档常指定 Windows 中文字体,沙箱里没有它们。
     映射到 Noto CJK,让 LibreOffice 渲染的预览/审阅图接近用户在 Windows 上看到的效果。
     只影响沙箱里的渲染,不会改动文件里写的字体名。 -->
<fontconfig>
  <alias binding="same">
    <family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>微软雅黑</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>SimHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>黑体</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>SimSun</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>KaiTi</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
</fontconfig>
