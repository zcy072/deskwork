[project]
name = "deskwork"
version = "0.1.0"
description = "Claude-style AI workspace for working with files in a sandboxed Docker container."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "langchain==1.3.9",
    "langchain-anthropic==1.7.6",
    "langchain-openai==1.2.2",
    "langgraph==1.2.4",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langsmith==0.10.10",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "redis==8.0.1",
    "sqlalchemy==2.0.55",
    "aiosqlite==0.22.1",
    "uvicorn==0.49.0",
    "websockets==17.3",
    "langchain-mcp-adapters==0.3.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "python-pptx==1.0.2",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 长提示词与测试数据允许超长行
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 导入顺序有意为之:先初始化 logger / sys.path 再导入后续模块
"app/utils/__init__.py" = ["E402"]
# FastAPI 依赖注入的标准写法
"app/api/routes/stream.py" = ["B008"]
