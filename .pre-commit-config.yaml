exclude: ^sandbox_data/
repos:
  # ruff 使用 backend 里固定版本的 dev 依赖,与 CI 保持一致;
  # 在 backend/ 下执行,保证 isort 能识别 app 是第一方包
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check --fix "${@#backend/}"' --
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format "${@#backend/}"' --
        language: system
        types: [python]
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
