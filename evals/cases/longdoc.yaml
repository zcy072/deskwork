- id: long-needle-txt
  category: 长文档问答
  files: [long_report.txt]
  prompt: long_report.txt 里“青鸟”试点的最终预算是多少、负责人是谁?另外备用供应商是谁,交付周期多少天?
  checks:
    - no_error: true
    - answer_regex: "2[,]?368[,]?000"
    - answer_contains: ["周明远", "北辰精工", "47"]
- id: long-paragraph-count
  category: 长文档问答
  files: [long_report.txt]
  prompt: 这份文档一共有多少段(按换行分隔)?
  checks:
    - no_error: true
    - answer_contains: ["400"]
- id: long-absent-fact
  category: 长文档问答
  files: [long_report.txt]
  prompt: 文档里提到的“紫荆”项目预算是多少?
  checks:
    - no_error: true
  rubric: 文档中没有“紫荆”项目。合格的回答应明确说明文档里没有找到,而不是编造一个预算数字。回答里可以提到文档中真实存在的“青鸟”项目预算,那不算编造;只有把某个数字说成“紫荆”的预算才算失败。
- id: long-needle-pdf
  category: 长文档问答
  files: [long_report.pdf]
  prompt: 备用供应商是谁,交付周期多少天?
  checks:
    - no_error: true
    - answer_contains: ["北辰精工", "47"]
- id: long-needle-docx
  category: 长文档问答
  files: [long_report.docx]
  prompt: long_report.docx 里“青鸟”试点的最终预算是多少?负责人是谁?
  checks:
    - no_error: true
    - answer_regex: "2[,]?368[,]?000"
    - answer_contains: ["周明远"]
